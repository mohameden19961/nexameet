<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaMeet — Documentation</title>
  <meta name="description" content="Documentation complète de NexaMeet : plateforme universitaire de collaboration et de réunions intelligentes. 22 sections, architecture et parcours utilisateur.">
  <meta name="theme-color" content="#5b4bff">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235b4bff'/%3E%3Cstop offset='1' stop-color='%2300b8a9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='800' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="assets/vendor/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="assets/vendor/github-dark.min.css" id="hljs-dark" disabled>

  <style>
    :root {
      --bg: #f6f7fb;
      --bg-elev: #ffffff;
      --bg-soft: #eceffa;
      --text: #1a1f2c;
      --text-muted: #5d677c;
      --border: #e1e6f2;
      --brand: #5b4bff;
      --brand-2: #00a99d;
      --brand-soft: rgba(91, 75, 255, 0.10);
      --link: #4636e8;
      --code-bg: #f1f3fa;
      --shadow: 0 14px 40px rgba(24, 30, 60, 0.10);
      --sidebar-w: 288px;
      --toc-w: 224px;
      --topbar-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0d1119;
      --bg-elev: #141a25;
      --bg-soft: #1a2231;
      --text: #e9edf6;
      --text-muted: #9aa6bd;
      --border: #232c3d;
      --brand: #8b7cff;
      --brand-2: #2dd4bf;
      --brand-soft: rgba(139, 124, 255, 0.14);
      --link: #a99fff;
      --code-bg: #101621;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--topbar-h) + 20px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: var(--link); }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -60px;
      z-index: 200;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      transition: top 0.15s ease;
    }
    .skip-link:focus { top: 12px; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 6px 18px var(--brand-soft);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text strong { font-size: 15px; letter-spacing: -0.01em; }
    .brand-text small { font-size: 11px; color: var(--text-muted); }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      max-width: 540px;
      margin-left: auto;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 0 12px 0 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search::placeholder { color: var(--text-muted); }
    #search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
      background: var(--bg-elev);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 80;
      max-height: min(62vh, 520px);
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .search-result {
      display: block;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .search-result:hover,
    .search-result.active { background: var(--bg-soft); }
    .sr-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 650;
      margin-bottom: 2px;
    }
    .sr-title small {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .sr-snippet {
      display: block;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-muted);
    }
    .search-result mark {
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 3px;
      padding: 0 2px;
    }
    .search-empty {
      padding: 14px 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .icon-btn:hover {
      background: var(--bg-soft);
      color: var(--text);
      border-color: var(--border);
    }
    .icon-btn svg { width: 19px; height: 19px; }

    .menu-toggle { display: none; }

    /* ---------- Layout ---------- */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
      max-width: 1580px;
      margin: 0 auto;
    }

    .sidebar {
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      overflow-y: auto;
      padding: 24px 14px 30px;
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    .nav-group { margin-bottom: 22px; }
    .nav-group-title {
      padding: 0 10px;
      margin-bottom: 6px;
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .nav-link {
      display: block;
      padding: 7px 10px;
      border-left: 2px solid transparent;
      border-radius: 7px;
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.4;
      text-decoration: none;
      transition: background 0.13s, color 0.13s, border-color 0.13s;
    }
    .nav-link:hover { background: var(--bg-soft); color: var(--text); }
    .nav-link.active {
      background: var(--brand-soft);
      border-left-color: var(--brand);
      color: var(--brand);
      font-weight: 650;
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 10px 0;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .sidebar-footer a { color: var(--text-muted); text-decoration: none; }
    .sidebar-footer a:hover { color: var(--brand); }

    .main {
      min-width: 0;
      padding: 34px 46px 80px;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      max-width: 880px;
      margin: 0 auto 18px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .breadcrumb { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .breadcrumb .sep { opacity: 0.5; }
    .breadcrumb strong { color: var(--text); font-weight: 650; }
    .edit-link {
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 1px solid transparent;
    }
    .edit-link:hover { color: var(--brand); border-bottom-color: currentColor; }

    .markdown-body {
      max-width: 880px;
      margin: 0 auto;
      font-size: 16px;
      overflow-wrap: break-word;
    }
    .markdown-body > *:first-child { margin-top: 0; }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      line-height: 1.25;
      letter-spacing: -0.018em;
      scroll-margin-top: calc(var(--topbar-h) + 20px);
    }
    .markdown-body h1 {
      margin: 0 0 0.55em;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
      font-size: clamp(1.8rem, 4vw, 2.35rem);
      letter-spacing: -0.03em;
    }
    .markdown-body h2 {
      margin: 2.1em 0 0.65em;
      padding-bottom: 0.32em;
      border-bottom: 1px solid var(--border);
      font-size: 1.42rem;
    }
    .markdown-body h3 { margin: 1.7em 0 0.55em; font-size: 1.14rem; }
    .markdown-body h4 { margin: 1.4em 0 0.45em; font-size: 1rem; }
    .markdown-body p { margin: 0.85em 0; }
    .markdown-body ul,
    .markdown-body ol { margin: 0.8em 0; padding-left: 1.45em; }
    .markdown-body li { margin: 0.28em 0; }
    .markdown-body li::marker { color: var(--brand); }
    .markdown-body strong { font-weight: 680; }

    .markdown-body a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.12s;
    }
    .markdown-body a:hover { border-bottom-color: currentColor; }

    .markdown-body blockquote {
      margin: 1.2em 0;
      padding: 0.85em 1.1em;
      border-left: 4px solid var(--brand);
      border-radius: 0 10px 10px 0;
      background: var(--brand-soft);
    }
    .markdown-body blockquote p { margin: 0.3em 0; }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 2.2em 0;
    }

    .markdown-body code {
      padding: 0.17em 0.4em;
      border-radius: 5px;
      background: var(--code-bg);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 0.875em;
    }
    .markdown-body pre {
      margin: 0;
      padding: 16px 18px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--code-bg);
      line-height: 1.55;
    }
    .markdown-body pre code {
      padding: 0;
      background: none;
      font-size: 0.855rem;
    }

    .markdown-body img { max-width: 100%; height: auto; }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
    }
    .markdown-body th,
    .markdown-body td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .markdown-body th { background: var(--bg-soft); font-weight: 650; }
    .markdown-body tbody tr:nth-child(even) td { background: var(--bg-soft); }

    .table-wrap {
      margin: 1.2em 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .table-wrap table { border: 0; min-width: 520px; }
    .table-wrap th,
    .table-wrap td { border-left: 0; border-right: 0; }

    .heading-anchor {
      margin-left: 0.35em;
      color: var(--text-muted);
      font-weight: 400;
      text-decoration: none;
      opacity: 0;
      border-bottom: 0 !important;
      transition: opacity 0.12s;
    }
    .markdown-body h1:hover .heading-anchor,
    .markdown-body h2:hover .heading-anchor,
    .markdown-body h3:hover .heading-anchor,
    .markdown-body h4:hover .heading-anchor { opacity: 0.55; }
    .heading-anchor:hover { opacity: 1 !important; color: var(--brand); }

    .code-block { position: relative; margin: 1.2em 0; }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-elev);
      color: var(--text-muted);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }
    .code-block:hover .copy-btn,
    .copy-btn:focus-visible { opacity: 1; }
    .copy-btn:hover { color: var(--brand); border-color: var(--brand); }

    .mermaid {
      margin: 1.4em 0;
      padding: 16px;
      overflow-x: auto;
      text-align: center;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .mermaid svg { max-width: 100%; height: auto; }

    .pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 880px;
      margin: 46px auto 0;
    }
    .pager a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elev);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .pager a:hover {
      border-color: var(--brand);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .pager .next { text-align: right; }
    .pager small {
      display: block;
      margin-bottom: 2px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .pager strong { font-size: 14px; font-weight: 650; }
    .pager .empty { visibility: hidden; }

    .footer {
      max-width: 880px;
      margin: 40px auto 0;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ---------- Table of contents ---------- */
    .toc {
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      overflow-y: auto;
      padding: 36px 18px;
      border-left: 1px solid var(--border);
      scrollbar-width: thin;
    }
    .toc-title {
      margin-bottom: 10px;
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .toc-link {
      display: block;
      padding: 4px 0 4px 11px;
      border-left: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.4;
      text-decoration: none;
      transition: color 0.12s, border-color 0.12s;
    }
    .toc-link.toc-h3 { padding-left: 23px; font-size: 12px; }
    .toc-link:hover { color: var(--text); }
    .toc-link.active { color: var(--brand); border-left-color: var(--brand); }

    /* ---------- States ---------- */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 40px 0;
      color: var(--text-muted);
    }
    .loading::before {
      content: "";
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      padding: 18px 20px;
      border: 1px solid #e5a3a3;
      border-left: 4px solid #d64545;
      border-radius: 10px;
      background: rgba(214, 69, 69, 0.08);
    }
    .error-box code { font-size: 13px; }

    .back-to-top {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-elev);
      color: var(--text-muted);
      box-shadow: var(--shadow);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s, color 0.15s;
    }
    .back-to-top.visible { opacity: 1; visibility: visible; transform: none; }
    .back-to-top:hover { color: var(--brand); border-color: var(--brand); }

    .overlay { position: fixed; inset: 0; z-index: 55; background: rgba(8, 12, 20, 0.5); }

    [hidden] { display: none !important; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1280px) {
      .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
      .toc { display: none; }
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 60;
        width: min(86vw, 320px);
        height: 100vh;
        padding-top: 20px;
        background: var(--bg-elev);
        transform: translateX(-105%);
        transition: transform 0.25s ease;
        box-shadow: var(--shadow);
      }
      .sidebar.open { transform: none; }
      .menu-toggle { display: inline-flex; }
      .main { padding: 24px 20px 64px; }
      .brand-text small { display: none; }
      .search-wrap { max-width: none; }
      .topbar { gap: 10px; padding: 0 12px; }
      .pager { grid-template-columns: 1fr; }
      .pager .next { text-align: left; }
      .content-header { flex-direction: column; align-items: flex-start; gap: 4px; }
    }

    @media (max-width: 520px) {
      .brand-text { display: none; }
      .top-actions { gap: 0; }
      .markdown-body { font-size: 15.5px; }
      .markdown-body h1 { font-size: 1.7rem; }
      .markdown-body h2 { font-size: 1.28rem; }
    }

    @media (hover: none) {
      .copy-btn { opacity: 1; }
    }

    @media print {
      .topbar, .sidebar, .toc, .pager, .content-header, .back-to-top, .footer { display: none !important; }
      .layout { display: block; }
      .main { padding: 0; }
      .markdown-body { max-width: none; }
      a { color: inherit; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <header class="topbar">
    <button id="menu-toggle" class="icon-btn menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="brand" href="?doc=README.md" data-home>
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-text"><strong>NexaMeet</strong><small>Documentation</small></span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher dans la documentation…" autocomplete="off" spellcheck="false" aria-label="Rechercher dans la documentation" aria-controls="search-results" aria-expanded="false">
      <div id="search-results" class="search-results" hidden></div>
    </div>

    <div class="top-actions">

  <script>

          ]
        }
      ];

      const FLAT = NAV
        .flatMap((group) => group.items.map((item) => ({ ...item, group: group.group })))
        .filter((item) => !item.external && DOCS[item.path]);

      const PAGE_ORDER = FLAT.filter((item) => DOCS[item.path]);

      const ICONS = {
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
        moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'
      };

      const els = {
        article: document.getElementById("contenu"),
        nav: document.getElementById("nav"),
        sidebar: document.getElementById("sidebar"),
        overlay: document.getElementById("overlay"),
        menuToggle: document.getElementById("menu-toggle"),
        search: document.getElementById("search"),
        results: document.getElementById("search-results"),
        themeToggle: document.getElementById("theme-toggle"),
        breadcrumb: document.getElementById("breadcrumb"),
        editLink: document.getElementById("edit-link"),
        pager: document.getElementById("pager"),
        toc: document.getElementById("toc"),
        tocList: document.getElementById("toc-list"),
        backToTop: document.getElementById("back-to-top"),
        home: document.querySelector("[data-home]")
      };

      let currentPath = null;
      let headings = [];
      let tocRaf = 0;
      let searchIndex = null;
      let activeResult = -1;
      let searchTimer = 0;

      const THEME_KEY = "nexameet-theme";

      /* ---------- Utils ---------- */

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[char]));
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function normalize(value) {
        return String(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function slugify(value) {
        return String(value)
          .trim()
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s-]/gu, "")
          .replace(/\s+/g, "-");
      }

      function resolvePath(baseDir, relative) {
        const parts = (baseDir ? baseDir.split("/") : []).concat(relative.split("/"));
        const output = [];
        for (const part of parts) {
          if (!part || part === ".") continue;
          if (part === "..") output.pop();
          else output.push(part);
        }
        return output.join("/");
      }

      function dirOf(path) {
        const index = path.lastIndexOf("/");
        return index === -1 ? "" : path.slice(0, index);
      }

      function titleFromPath(path) {
        const base = path.split("/").pop().replace(/\.md$/i, "");
        return base.replace(/^\d+-/, "").replace(/-/g, " ");
      }

      function docLabel(path) {
        const item = PAGE_ORDER.find((entry) => entry.path === path);
        return item ? item.label : titleFromPath(path);
      }

      function docGroup(path) {
        const item = PAGE_ORDER.find((entry) => entry.path === path);
        return item ? item.group : "Documentation";
      }

      function scrollToTop(instant) {
        window.scrollTo({ top: 0, behavior: instant ? "auto" : "smooth" });
      }

      /* ---------- Theme ---------- */

      function systemTheme() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function applyTheme(theme, persist) {
        document.documentElement.dataset.theme = theme;
        if (persist) {
          try { localStorage.setItem(THEME_KEY, theme); } catch (error) { /* ignore */ }
        }
        els.themeToggle.innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
        els.themeToggle.setAttribute("aria-label", theme === "dark" ? "Passer au thème clair" : "Passer au thème sombre");
        const light = document.getElementById("hljs-light");
        const dark = document.getElementById("hljs-dark");
        if (light) light.disabled = theme === "dark";
        if (dark) dark.disabled = theme !== "dark";
        initMermaid();
      }

      function initMermaid() {
        if (!window.mermaid) return;
        window.mermaid.initialize({
          startOnLoad: false,
          theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default",
          securityLevel: "loose",
          fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
          flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" },
          sequence: { useMaxWidth: true },
          er: { useMaxWidth: true }
        });
      }

      /* ---------- Navigation ---------- */

      function renderNav() {
        els.nav.innerHTML = NAV.map((group) => {
          const links = group.items.map((item) => {
            const active = item.path === currentPath ? " active" : "";
            if (item.external) {
              return '<a class="nav-link" href="' + escapeHtml(item.path) + '" target="_blank" rel="noopener">' +
                escapeHtml(item.label) + "</a>";
            }
            return '<a class="nav-link' + active + '" href="?doc=' + encodeURIComponent(item.path) + '" data-doc="' +
              escapeHtml(item.path) + '">' + escapeHtml(item.label) + "</a>";
          }).join("");
          return '<div class="nav-group"><div class="nav-group-title">' + escapeHtml(group.group) +
            "</div>" + links + "</div>";
        }).join("");
      }

      function renderBreadcrumb(path) {
        els.breadcrumb.innerHTML = '<span>' + escapeHtml(docGroup(path)) + '</span><span class="sep">/</span><strong>' +
          escapeHtml(docLabel(path)) + "</strong>";
      }

      function renderPager(path) {
        const index = PAGE_ORDER.findIndex((item) => item.path === path);
        if (index === -1) { els.pager.innerHTML = ""; return; }
        const previous = PAGE_ORDER[index - 1];
        const next = PAGE_ORDER[index + 1];
        const previousHtml = previous
          ? '<a class="prev" href="?doc=' + encodeURIComponent(previous.path) + '" data-doc="' + escapeHtml(previous.path) +
            '"><small>← Précédent</small><strong>' + escapeHtml(previous.label) + "</strong></a>"
          : '<span class="empty"></span>';
        const nextHtml = next
          ? '<a class="next" href="?doc=' + encodeURIComponent(next.path) + '" data-doc="' + escapeHtml(next.path) +
            '"><small>Suivant →</small><strong>' + escapeHtml(next.label) + "</strong></a>"
          : '<span class="empty"></span>';
        els.pager.innerHTML = previousHtml + nextHtml;
        els.pager.querySelectorAll("a[data-doc]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            loadDoc(link.dataset.doc, "", true);
          });
        });
      }

      function closeSidebar() {
        els.sidebar.classList.remove("open");
        els.overlay.hidden = true;
        els.menuToggle.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
      }

      function openSidebar() {
        els.sidebar.classList.add("open");
        els.overlay.hidden = false;
        els.menuToggle.setAttribute("aria-expanded", "true");
      }

      /* ---------- Markdown post-processing ---------- */

      function addHeadingAnchors() {
        const used = new Map();
        const nodes = els.article.querySelectorAll("h1, h2, h3, h4, h5, h6");
        nodes.forEach((heading) => {
          const text = heading.textContent.trim();
          let id = slugify(text) || "section";
          const count = used.get(id) || 0;
          used.set(id, count + 1);
          if (count > 0) id = id + "-" + count;
          heading.id = id;
          heading.dataset.title = text;

          const anchor = document.createElement("a");
          anchor.className = "heading-anchor";
          anchor.href = "#" + id;
          anchor.setAttribute("aria-label", "Lien vers cette section");
          anchor.textContent = "#";
          heading.appendChild(anchor);
        });
      }

      function wrapTables() {
        els.article.querySelectorAll("table").forEach((table) => {
          if (table.parentElement && table.parentElement.classList.contains("table-wrap")) return;
          const wrapper = document.createElement("div");
          wrapper.className = "table-wrap";
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
      }

      function resolveLinks(baseDir) {
        els.article.querySelectorAll("a[href]").forEach((link) => {
          const raw = link.getAttribute("href");
          if (!raw || raw.startsWith("#")) return;
          if (/^(https?:|mailto:|tel:)/i.test(raw)) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            return;
          }

          const hashIndex = raw.indexOf("#");
          const pathPart = hashIndex === -1 ? raw : raw.slice(0, hashIndex);
          const hashPart = hashIndex === -1 ? "" : raw.slice(hashIndex + 1);
          if (!pathPart) return;

          const resolved = resolvePath(baseDir, pathPart);
          if (DOCS[resolved]) {
            link.dataset.doc = resolved;
            link.dataset.hash = hashPart;
            link.setAttribute("href", "?doc=" + encodeURIComponent(resolved) + (hashPart ? "#" + hashPart : ""));
            return;
          }

          link.setAttribute("href", resolved + (hashPart ? "#" + hashPart : ""));
          if (/\.(svg|png|jpe?g|gif|webp|pdf|drawio)$/i.test(resolved)) {
            link.target = "_blank";
            link.rel = "noopener";
          }
        });
      }

      function addCopyButtons() {
        els.article.querySelectorAll("pre").forEach((pre) => {
          if (pre.parentElement && pre.parentElement.classList.contains("code-block")) return;
          const wrapper = document.createElement("div");
          wrapper.className = "code-block";
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(pre);

          const button = document.createElement("button");
          button.type = "button";
          button.className = "copy-btn";
          button.textContent = "Copier";
          button.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(pre.innerText);
              button.textContent = "Copié !";
            } catch (error) {
              button.textContent = "Impossible";
            }
            window.setTimeout(() => { button.textContent = "Copier"; }, 1600);
          });
          wrapper.appendChild(button);
        });
      }

      function highlightCode() {
        if (!window.hljs) return;
        els.article.querySelectorAll("pre code").forEach((block) => {
          if (block.classList.contains("language-mermaid")) return;
          try { window.hljs.highlightElement(block); } catch (error) { /* ignore */ }
        });
      }

      async function renderMermaid() {
        if (!window.mermaid) return;
        const codeBlocks = els.article.querySelectorAll("pre > code.language-mermaid");
        codeBlocks.forEach((code) => {
          const container = document.createElement("div");
          container.className = "mermaid";
          container.textContent = code.textContent;
          code.parentElement.replaceWith(container);
        });

        const nodes = Array.from(els.article.querySelectorAll(".mermaid"));
        for (const node of nodes) {
          try {
            await window.mermaid.run({ nodes: [node] });
          } catch (error) {
            node.classList.add("mermaid-error");
            node.setAttribute("title", "Diagramme Mermaid non rendu");
          }
        }
      }

      function buildToc() {
        headings = Array.from(els.article.querySelectorAll("h2, h3")).filter((heading) => heading.id);
        if (!headings.length) {
          els.tocList.innerHTML = "";
          els.toc.hidden = true;
          return;
        }
        els.toc.hidden = false;
        els.tocList.innerHTML = headings.map((heading) => {
          const level = heading.tagName.toLowerCase();
          const title = heading.dataset.title || heading.textContent.replace(/#$/, "").trim();
          return '<a class="toc-link toc-' + level + '" href="#' + heading.id + '" data-target="' +
            heading.id + '">' + escapeHtml(title) + "</a>";
        }).join("");
        updateActiveToc();
      }

      function updateActiveToc() {
        if (!headings.length) return;
        const threshold = window.scrollY + 120;
        let active = headings[0];
        for (const heading of headings) {
          const top = heading.getBoundingClientRect().top + window.scrollY;
          if (top <= threshold) active = heading;
          else break;
        }
        els.tocList.querySelectorAll(".toc-link").forEach((link) => {
          link.classList.toggle("active", link.dataset.target === active.id);
        });
      }

      async function postProcess(baseDir) {
        addHeadingAnchors();
        wrapTables();
        resolveLinks(baseDir);
        addCopyButtons();
        await renderMermaid();
        highlightCode();
        buildToc();
      }

      /* ---------- Document loading ---------- */

      function parseUrl() {
        const params = new URLSearchParams(window.location.search);
        let path = params.get("doc") || "README.md";
        path = decodeURIComponent(path).replace(/^\/+/, "");
        if (!DOCS[path]) path = "README.md";
        return { path, hash: window.location.hash.slice(1) };
      }

      async function loadDoc(path, hash, push, options) {
        const settings = options || {};
        if (!DOCS[path]) {
          els.article.innerHTML = '<div class="error-box"><strong>Document introuvable.</strong><p>Le fichier <code>' +
            escapeHtml(path) + "</code> ne fait pas partie du site.</p></div>";
          return;
        }

        currentPath = path;
        renderBreadcrumb(path);
        els.editLink.href = REPO_URL + "/blob/main/" + path;
        if (!settings.keepTitle) {
          document.title = docLabel(path) + " — NexaMeet Documentation";
        }

        let html;
        try {
          if (!window.marked) throw new Error("marked indisponible");
          html = window.marked.parse(DOCS[path], { gfm: true, breaks: false });
        } catch (error) {
          els.article.innerHTML = '<div class="error-box"><strong>Impossible de convertir le Markdown.</strong>' +
            "<p>Vérifiez votre connexion (la bibliothèque <code>marked</code> est chargée depuis un CDN), " +
            "puis rechargez la page.</p></div>";
          return;
        }

        els.article.innerHTML = html;
        renderNav();
        renderPager(path);

        if (push) {
          const url = new URL(window.location.href);
          url.searchParams.set("doc", path);
          url.hash = hash ? hash : "";
          window.history.pushState({ path, hash }, "", url);
        }

        await postProcess(dirOf(path));
        closeSearch();

        if (settings.preserveScroll != null) {
          window.scrollTo(0, settings.preserveScroll);
        } else if (hash) {
          let target = null;
          try { target = document.getElementById(decodeURIComponent(hash)); } catch (error) { target = null; }
          if (!target) target = document.getElementById(slugify(hash));
          if (target) {
            target.scrollIntoView({ behavior: "auto", block: "start" });
          } else {
            scrollToTop(true);
          }
        } else {
          scrollToTop(true);
        }
        updateActiveToc();
      }

      /* ---------- Search ---------- */

      function plainText(markdown) {
        return String(markdown)
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/~~~[\s\S]*?~~~/g, " ")
          .replace(/`[^`]*`/g, " ")
          .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/<[^>]+>/g, " ")
          .replace(/[#>*_|~]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function ensureSearchIndex() {
        if (searchIndex) return searchIndex;
        searchIndex = FLAT.map((item) => {
          const text = plainText(DOCS[item.path]);
          return {
            path: item.path,
            label: item.label,
            group: item.group,
            text,
            normalized: normalize(text),
            title: normalize(item.label)
          };
        });
        return searchIndex;
      }

      function highlightSnippet(text, query) {
        const escaped = escapeHtml(text);
        if (!query) return escaped;
        try {
          return escaped.replace(new RegExp("(" + escapeRegExp(query) + ")", "gi"), "<mark>$1</mark>");
        } catch (error) {
          return escaped;
        }
      }

      function runSearch() {
        const raw = els.search.value.trim();
        if (raw.length < 2) {
          closeSearch();
          return;
        }

        const query = normalize(raw);
        const hits = [];
        for (const doc of ensureSearchIndex()) {
          const titleMatch = doc.title.includes(query);
          const position = doc.normalized.indexOf(query);
          if (!titleMatch && position === -1) continue;

          const start = Math.max(0, (position === -1 ? 0 : position) - 55);
          const excerpt = doc.text.slice(start, start + 170);
          hits.push({
            doc,
            titleMatch,
            position,
            snippet: (start > 0 ? "…" : "") + excerpt + (start + 170 < doc.text.length ? "…" : "")
          });
        }

        hits.sort((a, b) => {
          if (a.titleMatch !== b.titleMatch) return a.titleMatch ? -1 : 1;
          return a.doc.label.localeCompare(b.doc.label, "fr");
        });

        const top = hits.slice(0, 8);
        activeResult = -1;
        els.results.hidden = false;
        els.search.setAttribute("aria-expanded", "true");

        if (!top.length) {
          els.results.innerHTML = '<div class="search-empty">Aucun résultat pour « ' + escapeHtml(raw) + ' ».</div>';
          return;
        }

        els.results.innerHTML = top.map((hit, index) => {
          return '<button type="button" class="search-result" data-path="' + escapeHtml(hit.doc.path) + '" data-index="' +
            index + '"><span class="sr-title">' + escapeHtml(hit.doc.label) + "<small>" + escapeHtml(hit.doc.group) +
            '</small></span><span class="sr-snippet">' + highlightSnippet(hit.snippet, raw) + "</span></button>";
        }).join("");
      }

      function closeSearch() {
        els.results.hidden = true;
        els.search.setAttribute("aria-expanded", "false");
        activeResult = -1;
      }

      function moveSearchSelection(delta) {
        const buttons = Array.from(els.results.querySelectorAll(".search-result"));
        if (!buttons.length) return;
        activeResult = (activeResult + delta + buttons.length) % buttons.length;
        buttons.forEach((button, index) => {
          button.classList.toggle("active", index === activeResult);
        });
        buttons[activeResult].scrollIntoView({ block: "nearest" });
      }

      /* ---------- Events ---------- */

      els.nav.addEventListener("click", (event) => {
        const link = event.target.closest("a[data-doc]");
        if (!link) return;
        event.preventDefault();
        loadDoc(link.dataset.doc, "", true);
        closeSidebar();
      });

      els.article.addEventListener("click", (event) => {
        const link = event.target.closest("a[data-doc]");
        if (link) {
          event.preventDefault();
          loadDoc(link.dataset.doc, link.dataset.hash || "", true);
          return;
        }
        const anchor = event.target.closest("a.heading-anchor");
        if (anchor) {
          event.preventDefault();
          const target = document.getElementById(anchor.getAttribute("href").slice(1));
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            window.history.replaceState(null, "", "?doc=" + encodeURIComponent(currentPath) + anchor.getAttribute("href"));
          }
        }
      });

      els.tocList.addEventListener("click", (event) => {
        const link = event.target.closest("a[data-target]");
        if (!link) return;
        event.preventDefault();
        const target = document.getElementById(link.dataset.target);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          window.history.replaceState(null, "", "?doc=" + encodeURIComponent(currentPath) + "#" + link.dataset.target);
        }
      });

      els.search.addEventListener("input", () => {
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(runSearch, 110);
      });

      els.search.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          moveSearchSelection(1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveSearchSelection(-1);
        } else if (event.key === "Enter") {
          const buttons = Array.from(els.results.querySelectorAll(".search-result"));
          const target = buttons[activeResult] || buttons[0];
          if (target) {
            event.preventDefault();
            target.click();
          }
        } else if (event.key === "Escape") {
          closeSearch();
          els.search.blur();
        }
      });

      els.results.addEventListener("click", (event) => {
        const button = event.target.closest(".search-result");
        if (!button) return;
        loadDoc(button.dataset.path, "", true);
        closeSearch();
        els.search.blur();
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search-wrap")) closeSearch();
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const typing = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" ||
          target.tagName === "SELECT" || target.isContentEditable);
        if ((event.key === "/" && !typing) || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k")) {
          event.preventDefault();
          els.search.focus();
          els.search.select();
        }
        if (event.key === "Escape") closeSidebar();
      });

      els.menuToggle.addEventListener("click", () => {
        if (els.sidebar.classList.contains("open")) closeSidebar();
        else openSidebar();
      });
      els.overlay.addEventListener("click", closeSidebar);

      els.themeToggle.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next, true);
        if (currentPath) {
          const position = window.scrollY;
          loadDoc(currentPath, "", false, { preserveScroll: position, keepTitle: true });
        }
      });

      els.home.addEventListener("click", (event) => {
        event.preventDefault();
        loadDoc("README.md", "", true);
      });

      els.backToTop.addEventListener("click", () => scrollToTop(false));

      window.addEventListener("scroll", () => {
        els.backToTop.classList.toggle("visible", window.scrollY > 650);
        window.cancelAnimationFrame(tocRaf);
        tocRaf = window.requestAnimationFrame(updateActiveToc);
      }, { passive: true });

      window.addEventListener("popstate", () => {
        const { path, hash } = parseUrl();
        loadDoc(path, hash, false);
      });

      const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      if (media && media.addEventListener) {
        media.addEventListener("change", () => {
          let stored = null;
          try { stored = localStorage.getItem(THEME_KEY); } catch (error) { /* ignore */ }
          if (!stored) applyTheme(systemTheme(), false);
        });
      }

      /* ---------- Boot ---------- */

      async function boot() {
        let stored = null;
        try { stored = localStorage.getItem(THEME_KEY); } catch (error) { /* ignore */ }
        applyTheme(stored === "dark" || stored === "light" ? stored : systemTheme(), false);

        if (!Object.keys(DOCS).length) {
          els.article.innerHTML = '<div class="error-box"><strong>Contenu introuvable.</strong>' +
            "<p>Le fichier <code>content.js</code> n’a pas été chargé ou est vide.</p>" +
            "<p>Générez-le depuis la racine du dépôt avec :</p>" +
            "<pre><code>node tools/build-content.js</code></pre></div>";
          return;
        }

        const { path, hash } = parseUrl();
        await loadDoc(path, hash, false);
      }

      boot();
    })();
  </script>
</body>
</html>
